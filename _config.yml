title: Dr James Wyatt
email: jimbokwyatt@gmamil.com
description: >- # this means to ignore newlines until "baseurl:"
  Observational oceanographer studying ocean circulation,
  water masses and transport across the Greenland–Scotland Ridge and in the Southern Ocean.
github_username: jkwyatt
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "James Wyatt"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Observational Oceanographer at the Faroe Marine Research Institute"
  location: "Faroe Islands"
  links:
     - label: "Faroe Marine Research Institute"
      icon: "fas fa-fw fa-building"
      url: "https://www.hav.fo/famri/"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "jamesw@hav.fo"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jkwyatt"

    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-2336-9842"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jkwyatt"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/jkwyattt"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
